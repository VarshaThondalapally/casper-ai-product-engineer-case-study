[project]
name = "casper-recipe-evidence-pipeline"
version = "1.0.0"
description = "Evaluation-first extraction and safe application of community recipe tweaks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.3.1,<4",
    "pydantic>=2.11.9",
    "python-dotenv>=1.2.2,<2",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "pyright>=1.1.411,<2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.11",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
